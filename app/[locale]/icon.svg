<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#0f1013"/>
  <g fill="#4ade80">
    <!-- tyre ring, 8x8 pixel grid, 4px cells -->
    <rect x="8"  y="0"  width="16" height="4"/>
    <rect x="4"  y="4"  width="4"  height="4"/>
    <rect x="24" y="4"  width="4"  height="4"/>
    <rect x="0"  y="8"  width="4"  height="16"/>
    <rect x="28" y="8"  width="4"  height="16"/>
    <rect x="4"  y="24" width="4"  height="4"/>
    <rect x="24" y="24" width="4"  height="4"/>
    <rect x="8"  y="28" width="16" height="4"/>
    <!-- hub -->
    <rect x="12" y="12" width="8" height="8"/>
    <!-- spokes -->
    <rect x="14" y="4"  width="4" height="8"/>
    <rect x="14" y="20" width="4" height="8"/>
    <rect x="4"  y="14" width="8" height="4"/>
    <rect x="20" y="14" width="8" height="4"/>
  </g>
</svg>
